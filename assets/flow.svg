<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Flow: new PR, shallow clone, agent runs rubric, one review comment, clone deleted">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070c"/>
      <stop offset="1" stop-color="#061020"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff3b30"/>
    </marker>
    <style>
      .box   { fill: #0a1220; stroke: #2ea8ff; stroke-width: 1.5; }
      .n     { fill: #ff3b30; font-size: 13px; }
      .t     { fill: #dcefff; font-size: 15px; }
      .s     { fill: #5b7489; font-size: 12.5px; }
      text   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="190" rx="14" fill="url(#fbg)"/>
  <rect x="0.5" y="0.5" width="1199" height="189" rx="14" fill="none" stroke="#14283c"/>

  <g class="conn" stroke="#ff3b30" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.75">
    <path d="M232 88 h34"/>
    <path d="M462 88 h34"/>
    <path d="M692 88 h34"/>
    <path d="M922 88 h34"/>
  </g>

  <g>
    <rect class="box" x="32" y="52" width="200" height="72" rx="10"/>
    <text class="n" x="46" y="76">01</text>
    <text class="t" x="72" y="77">new PR opened</text>
    <text class="s" x="46" y="104">gh polls every 3 min</text>

    <rect class="box" x="262" y="52" width="200" height="72" rx="10"/>
    <text class="n" x="276" y="76">02</text>
    <text class="t" x="302" y="77">shallow clone</text>
    <text class="s" x="276" y="104">into ~/.prwatch/cache</text>

    <rect class="box" x="492" y="52" width="200" height="72" rx="10"/>
    <text class="n" x="506" y="76">03</text>
    <text class="t" x="532" y="77">your agent runs</text>
    <text class="s" x="506" y="104">rubric + fenced PR text</text>

    <rect class="box" x="722" y="52" width="200" height="72" rx="10"/>
    <text class="n" x="736" y="76">04</text>
    <text class="t" x="762" y="77">one comment</text>
    <text class="s" x="736" y="104">posted once, ever</text>

    <rect class="box" x="952" y="52" width="216" height="72" rx="10"/>
    <text class="n" x="966" y="76">05</text>
    <text class="t" x="992" y="77">clone deleted</text>
    <text class="s" x="966" y="104">cache empty between runs</text>
  </g>

  <text class="s" x="32" y="164">Nothing runs in CI. Everything happens on your machine, with your agent subscription.</text>
</svg>
