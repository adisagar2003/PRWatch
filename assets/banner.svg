<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="PRWatch — review your own PRs with the agent you already pay for">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070c"/>
      <stop offset="0.55" stop-color="#061020"/>
      <stop offset="1" stop-color="#04070c"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2ea8ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <radialGradient id="iris" cx="0.42" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#fff3e8"/>
      <stop offset="0.16" stop-color="#ffcf9a"/>
      <stop offset="0.42" stop-color="#ff3b30"/>
      <stop offset="0.78" stop-color="#c62012"/>
      <stop offset="1" stop-color="#5c0d06"/>
    </radialGradient>

    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79e6ff"/>
      <stop offset="0.5" stop-color="#2ea8ff"/>
      <stop offset="1" stop-color="#1b6cff"/>
    </linearGradient>

    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79e6ff"/>
      <stop offset="0.38" stop-color="#2ea8ff"/>
      <stop offset="0.66" stop-color="#eaf6ff"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- the almond opening: everything inside the eye is clipped to it -->
    <clipPath id="opening">
      <path d="M60 160 Q210 44 360 160 Q210 276 60 160 Z"/>
    </clipPath>

    <!-- blink: the whole eye is clipped to a band that snaps shut every few seconds -->
    <clipPath id="blink">
      <rect x="0" y="20" width="420" height="280">
        <animate attributeName="y" dur="6s" repeatCount="indefinite"
          keyTimes="0;0.82;0.855;0.89;1" values="20;20;158;20;20"/>
        <animate attributeName="height" dur="6s" repeatCount="indefinite"
          keyTimes="0;0.82;0.855;0.89;1" values="280;280;4;280;280"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#14283c"/>

  <g clip-path="url(#blink)">
    <!-- eyelashes -->
    <g stroke="url(#lid)" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <path d="M132 92 l-10 -20"/><path d="M172 72 l-6 -22"/><path d="M212 64 l0 -23"/>
      <path d="M252 72 l6 -22"/><path d="M292 92 l10 -20"/>
    </g>

    <g filter="url(#glow)">
      <!-- sclera + lids -->
      <path d="M60 160 Q210 44 360 160 Q210 276 60 160 Z" fill="#08131f"
            stroke="url(#lid)" stroke-width="3.5"/>

      <g clip-path="url(#opening)">
        <!-- iris -->
        <circle cx="210" cy="160" r="66" fill="url(#iris)"/>
        <!-- iris fibres: a fat dashed ring reads as radial striation -->
        <g>
          <circle cx="210" cy="160" r="46" fill="none" stroke="#ffb08a" stroke-opacity="0.35"
                  stroke-width="42" stroke-dasharray="2 7"/>
          <circle cx="210" cy="160" r="58" fill="none" stroke="#4a0b04" stroke-opacity="0.45"
                  stroke-width="16" stroke-dasharray="3 9"/>
          <animateTransform attributeName="transform" type="rotate" values="0 210 160;360 210 160"
                            dur="90s" repeatCount="indefinite"/>
        </g>
        <!-- limbal ring, pupil, catchlight -->
        <circle cx="210" cy="160" r="65" fill="none" stroke="#3d0803" stroke-width="5" stroke-opacity="0.8"/>
        <circle cx="210" cy="160" r="22" fill="#0a0201"/>
        <ellipse cx="188" cy="136" rx="13" ry="9" fill="#fff" opacity="0.85" transform="rotate(-28 188 136)"/>
        <circle cx="234" cy="186" r="4" fill="#ffd9c2" opacity="0.5"/>
      </g>

      <!-- contour detail on the sclera -->
      <g fill="none" stroke="#2ea8ff" stroke-opacity="0.35" stroke-width="1.5">
        <path d="M74 160 Q210 60 346 160" stroke-dasharray="4 8"/>
        <path d="M74 160 Q210 260 346 160" stroke-dasharray="4 8"/>
      </g>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="430" y="150" font-size="76" font-weight="700" letter-spacing="14" fill="url(#mark)">PRWATCH</text>
    <text x="434" y="196" font-size="21" fill="#8ba6bf">Your PRs, reviewed by the agent you already pay for.</text>
    <text x="434" y="232" font-size="21" fill="#8ba6bf">Local daemon. Zero CI cost.</text>
    <g font-size="16" fill="#5b7489" letter-spacing="2">
      <text x="434" y="276">CLAUDE  ·  CODEX  ·  OPENCODE</text>
    </g>
  </g>
</svg>
